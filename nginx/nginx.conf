events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens   off;

    # ─── Compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/wasm font/ttf font/otf;

    # ─── Rate Limiting ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstreams ──────────────────────────────────────
    # Docker's embedded DNS (127.0.0.11) is asked per request with a short
    # TTL instead of using static `upstream` blocks. A static block resolves
    # the hostname ONCE at startup: when a backend/frontend container is
    # recreated and gets a new IP, nginx keeps proxying to the dead address
    # and every request fails with 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Target URLs used with variables in proxy_pass (see below).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── HTTP Server ───────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ─── Security headers (all responses) ──────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        limit_conn conn_limit 50;

        # ─── API Routes ──────────────────────────────────
        # CORS is handled exclusively by the PHP CorsMiddleware.
        # nginx only forwards headers; it never adds its own ACAO.
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            # Variable form → resolved through `resolver` on every request.
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        # ─── Next.js hashed assets — immutable cache ────
        location /_next/static/ {
            set $frontend_url http://frontend:3000;
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── Public assets ───────────────────────────────
        location /_next/image {
            set $frontend_url http://frontend:3000;
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
        }

        # ─── Frontend Routes ────────────────────────────
        location / {
            set $frontend_url http://frontend:3000;
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ─── Health Check ────────────────────────────────
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }

    # ─── HTTPS Server (production) ──────────────────────
    # Enable after placing certs in nginx/ssl/{cert.pem,key.pem}:
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #
    #     location /api/  { ...same as HTTP... }
    #     location /     { ...same as HTTP... }
    # }
    #
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
