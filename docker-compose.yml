x-common-vars: &common-vars
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-financehub}
  DB_USER: ${DB_USER:-financehub_user}
  DB_PASS: ${DB_PASS:?DB_PASS is not set — copy .env.example to .env first}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set — copy .env.example to .env first}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}

services:
  db:
    image: mysql:8.0
    container_name: financehub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?DB_PASS is not set — copy .env.example to .env first}
      MYSQL_DATABASE: ${DB_NAME:-financehub}
      MYSQL_USER: ${DB_USER:-financehub_user}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS is not set — copy .env.example to .env first}
    # Not published on the host: only containers on financehub-net can reach it.
    # For local debugging use: docker compose exec db mysql -u financehub_user -p financehub
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - financehub-net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: financehub-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-vars
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost,http://localhost:3000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@financehub.dz}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      AI_RATE_LIMIT_MINUTE: ${AI_RATE_LIMIT_MINUTE:-10}
      AI_RATE_LIMIT_DAILY: ${AI_RATE_LIMIT_DAILY:-100}
      AUTH_RATE_LIMIT_MINUTE: ${AUTH_RATE_LIMIT_MINUTE:-20}
      APP_DEBUG: ${APP_DEBUG:-false}
      TZ: ${TZ:-Africa/Algiers}
    volumes:
      - ./backend/storage/logs:/var/www/storage/logs
    # Port published for direct debugging only; nginx proxies via the network.
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - financehub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_FINANCE_CURRENCY: ${NEXT_PUBLIC_FINANCE_CURRENCY:-DZD}
    container_name: financehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - financehub-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Background jobs: recurring generation, bill/budget/debt reminders,
  # anomaly sweep, daily health snapshots (crontab in backend/worker/).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: financehub-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-vars
      TZ: ${TZ:-Africa/Algiers}
    volumes:
      - ./backend/storage/logs:/var/www/storage/logs
    networks:
      - financehub-net

  nginx:
    image: nginx:1.27-alpine
    container_name: financehub-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - financehub-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:

networks:
  financehub-net:
    driver: bridge
