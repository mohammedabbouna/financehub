name: iOS

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        working-directory: ios
        run: xcodebuild -project FinanceHub.xcodeproj -scheme FinanceHub -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
      - name: Test
        working-directory: ios
        run: xcodebuild -project FinanceHub.xcodeproj -scheme FinanceHub -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test
