name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, zip
      - name: Install deps
        working-directory: backend
        run: composer install --no-interaction --no-progress
      - name: Lint PHP
        working-directory: backend
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/v1/health && break
            sleep 2
          done
      - name: Run smoke tests
        run: set -a && source .env && set +a && BASE_URL=http://localhost/api/v1 bash tests/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v
