server {
    listen 8000;
    server_name _;
    root /var/www/public;
    index index.php;

    # CORS is handled exclusively by PHP (CorsMiddleware).
    # Do NOT add Access-Control-* headers here: duplicate/conflicting
    # values across nginx and PHP break browser preflight checks.

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffering off;
    }

    location ~ /\.ht {
        deny all;
    }

    # Never expose internal files.
    location ~ ^/(storage|vendor|src|docker|composer) {
        deny all;
        return 404;
    }
}
